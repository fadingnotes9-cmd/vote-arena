<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a15">
  <title>⚔️ Vote Arena</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vote Arena">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  
  <div id="app">
    <header id="topBar">
      <div class="top-item">
        <span class="label">MATCH</span>
        <span id="matchNum" class="value">#1</span>
      </div>
      <div class="top-item center">
        <span class="label">TARGET</span>
        <span id="targetVal" class="value">100</span>
      </div>
      <div class="top-item right">
        <span class="label">STATUS</span>
        <span id="fbStatus" title="Firebase status">⏳</span>
        <span id="status" class="value running">● LIVE</span>
      </div>
    </header>
    
    <main id="arena"></main>
    
    <footer id="bottomBar">
      <div id="voteFeed"></div>
      <div id="commandHint">💬 Ketik <b id="cmd1">!ronaldo</b> atau <b id="cmd2">!messi</b> di chat</div>
    </footer>
  </div>
  
  <button id="setupBtn">⚙️</button>
  
  <div id="setupModal" class="modal hidden">
    <div class="modal-content">
      <h2>⚙️ Setup Arena</h2>
      <div id="playerInputs"></div>
      <button id="addPlayerBtn">+ Tambah Player</button>
      <div class="modal-field">
        <label>Target Poin:</label>
        <input type="number" id="targetInput" value="100" min="10" max="9999">
      </div>
      <div class="modal-field">
        <label>Match Number:</label>
        <input type="number" id="matchInput" value="1" min="1">
      </div>
      <div class="modal-section">
        <h3>🖼️ Background</h3>
        <div class="preset-row">
          <button class="preset-btn active" data-preset="default" data-color1="#1e1b4b" data-color2="#0a0a15" style="background:linear-gradient(160deg,#1e1b4b,#0a0a15);"></button>
          <button class="preset-btn" data-preset="ocean" data-color1="#0c4a6e" data-color2="#082f49" style="background:linear-gradient(160deg,#0c4a6e,#082f49);"></button>
          <button class="preset-btn" data-preset="forest" data-color1="#064e3b" data-color2="#0a0a15" style="background:linear-gradient(160deg,#064e3b,#0a0a15);"></button>
          <button class="preset-btn" data-preset="sunset" data-color1="#831843" data-color2="#0a0a15" style="background:linear-gradient(160deg,#831843,#0a0a15);"></button>
          <button class="preset-btn" data-preset="royal" data-color1="#4c1d95" data-color2="#0a0a15" style="background:linear-gradient(160deg,#4c1d95,#0a0a15);"></button>
        </div>
        <div class="upload-row">
          <label for="bgUploadInput" class="upload-btn">📁 Upload Gambar</label>
          <input type="file" id="bgUploadInput" accept="image/*" style="display:none;">
          <button id="bgClearBtn" class="clear-btn">🗑️ Hapus</button>
        </div>
        <div id="bgPreview" class="bg-preview"></div>
      </div>

      <div class="modal-section">
        <h3>🔊 Sound Vote</h3>
        <div class="modal-field">
          <label>Suara saat vote (default: ding)</label>
          <label for="soundUploadInput" class="upload-btn" style="width:100%;text-align:center;display:block;">🎵 Upload Suara Custom</label>
          <input type="file" id="soundUploadInput" accept="audio/*" style="display:none;">
        </div>
        <div class="modal-field" style="display:flex;gap:8px;">
          <button id="soundTestBtn" style="flex:1;padding:10px;background:rgba(255,255,255,0.1);border:none;border-radius:8px;color:#fff;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">🔊 Test Suara</button>
          <button id="soundClearBtn" style="flex:1;padding:10px;background:rgba(233,69,96,0.3);border:none;border-radius:8px;color:#fff;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">🗑️ Reset</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="saveBtn" class="primary">💾 Simpan</button>
        <button id="cancelBtn">Batal</button>
        <button id="resetBtn" class="danger">🗑️ Reset Skor</button>
      </div>
    </div>
  </div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase config + helper -->
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>
  <script>
    // Register Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('✅ SW registered:', reg.scope))
          .catch((err) => console.warn('⚠️ SW failed:', err));
      });
    }
  </script>
</body>
</html>
