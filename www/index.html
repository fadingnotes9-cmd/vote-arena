<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a15">
  <title>⚔️ Vote Arena</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vote Arena">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  
  <div id="app">
    <header id="topBar">
      <div class="top-item">
        <span class="label">MATCH</span>
        <span id="matchNum" class="value">#1</span>
      </div>
      <div class="top-item center">
        <span class="label">TARGET</span>
        <span id="targetVal" class="value">100</span>
      </div>
      <div class="top-item right">
        <span class="label">STATUS</span>
        <span id="fbStatus" title="Firebase status">⏳</span>
        <span id="status" class="value running">● LIVE</span>
      </div>
    </header>
    
    <main id="arena"></main>
    
    <footer id="bottomBar">
      <div id="voteFeed"></div>
      <div id="commandHint">💬 Ketik <b id="cmd1">!ronaldo</b> atau <b id="cmd2">!messi</b> di chat</div>
    </footer>
  </div>
  
  <button id="setupBtn">⚙️</button>
  
  <div id="setupModal" class="modal hidden">
    <div class="modal-content">
      <h2>⚙️ Setup Arena</h2>
      <div id="playerInputs"></div>
      <button id="addPlayerBtn">+ Tambah Player</button>
      <div class="modal-field">
        <label>Target Poin:</label>
        <input type="number" id="targetInput" value="100" min="10" max="9999">
      </div>
      <div class="modal-field">
        <label>Match Number:</label>
        <input type="number" id="matchInput" value="1" min="1">
      </div>
      <div class="modal-actions">
        <button id="saveBtn" class="primary">💾 Simpan</button>
        <button id="cancelBtn">Batal</button>
        <button id="resetBtn" class="danger">🗑️ Reset Skor</button>
      </div>
    </div>
  </div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase config + helper -->
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>
  <script>
    // Register Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('✅ SW registered:', reg.scope))
          .catch((err) => console.warn('⚠️ SW failed:', err));
      });
    }
  </script>
  <button id="testRtmpBtn" style="position:fixed;top:70px;left:15px;z-index:100;padding:8px 12px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:800;background:rgba(251,191,36,0.9);color:#1a1a2e;border:none;border-radius:8px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.4);">🔌 Test RTMP</button>
  <button id="rtmpLiveBtn" style="position:fixed;top:130px;left:15px;z-index:100;padding:10px 14px;font-size:12px;font-family:'Nunito',sans-serif;font-weight:800;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 15px rgba(220,38,38,0.5);">🔴 LIVE</button>

  <div id="rtmpModal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;padding:20px;font-family:'Nunito',sans-serif;">
    <div style="background:linear-gradient(160deg,#1a1a2e,#0a0a15);border:2px solid #dc2626;border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.7);">
      <h2 style="color:#dc2626;font-size:20px;margin:0 0 16px 0;text-align:center;letter-spacing:1px;">🎬 LIVE STREAMING</h2>
      
      <div id="rtmpStatusBox" style="background:rgba(0,0,0,0.4);border-left:3px solid #fbbf24;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:12px;color:#a0a0b0;">
        Status: <span id="rtmpStatusText" style="color:#fbbf24;font-weight:800;">Siap</span>
      </div>

      <label style="display:block;font-size:11px;color:#a0a0b0;font-weight:800;letter-spacing:1px;margin-bottom:6px;">RTMP URL</label>
      <input id="rtmpUrlInput" type="text" value="rtmp://a.rtmp.youtube.com/live2" placeholder="rtmp://..." style="width:100%;padding:12px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:#fff;font-size:13px;font-family:monospace;outline:none;margin-bottom:12px;box-sizing:border-box;">

      <label style="display:block;font-size:11px;color:#a0a0b0;font-weight:800;letter-spacing:1px;margin-bottom:6px;">STREAM KEY</label>
      <input id="rtmpKeyInput" type="text" placeholder="abcd-1234-efgh-5678" style="width:100%;padding:12px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:#fff;font-size:13px;font-family:monospace;outline:none;margin-bottom:16px;box-sizing:border-box;">

      <div style="background:rgba(251,191,36,0.1);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:11px;color:#a0a0b0;line-height:1.5;">
        💡 Ambil dari <b style="color:#fbbf24;">YouTube Studio → Create → Go Live</b>
      </div>

      <div style="display:flex;gap:8px;">
        <button id="rtmpStartBtn" style="flex:1;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;font-weight:800;font-family:'Nunito',sans-serif;font-size:14px;cursor:pointer;">▶ START LIVE</button>
        <button id="rtmpStopBtn" style="flex:1;padding:14px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;font-weight:800;font-family:'Nunito',sans-serif;font-size:14px;cursor:pointer;display:none;">⏹ STOP</button>
        <button id="rtmpCloseBtn" style="padding:14px 18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;font-weight:800;font-family:'Nunito',sans-serif;font-size:14px;cursor:pointer;">✕</button>
      </div>
    </div>
  </div>

  <script src="js/rtmp.js"></script>
</body>
</html>
